<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Locker terminal')}"></head>
<body>
<div th:replace="~{fragments/layout :: header(${nav}, 'Terminal', 'TM')}"></div>
<main id="main">
  <div class="page-head">
    <div>
      <div class="eyebrow">Locker terminal simulator</div>
      <h1 class="page-title">Choose a station terminal.</h1>
      <p class="page-sub">Each station has a touchscreen used by couriers (drop-off) and recipients (pickup).</p>
    </div>
  </div>
  <div class="form-grid-3" style="grid-template-columns:repeat(auto-fill,minmax(260px,1fr))">
    <a th:each="s, it : ${stations}" class="station-card" th:href="@{/terminal/{c}(c=${s.code})}" th:attr="data-testid='terminal-' + ${s.code}">
      <div class="row-between"><span class="station-name"><span class="num" th:text="${it.count}">1</span><span th:text="${s.name}">Fórum Aveiro</span></span>
        <svg width="18" height="18" style="color:var(--accent)" aria-hidden="true"><use href="/img/icons.svg#terminal"/></svg></div>
      <div class="station-meta" th:text="${s.address} + ' · ' + ${s.code}">addr</div>
      <span class="badge badge-dot badge-green" th:text="${s.free.total()} + ' free compartments'">10</span>
    </a>
  </div>
</main>
<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
