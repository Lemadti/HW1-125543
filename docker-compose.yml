# Orbit Lockers - local stack.
#   docker compose up -d db          -> only PostgreSQL (run the app with ./mvnw spring-boot:run)
#   docker compose up --build        -> PostgreSQL + application on http://localhost:8080
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: orbit
      POSTGRES_USER: orbit
      POSTGRES_PASSWORD: orbit
    ports:
      - "5432:5432"
    volumes:
      - orbit-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbit -d orbit"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      ORBIT_DB_URL: jdbc:postgresql://db:5432/orbit
      ORBIT_DB_USER: orbit
      ORBIT_DB_PASSWORD: orbit
      ORBIT_CODE_SECRET: change-me
      ORBIT_GEOCODER: ${ORBIT_GEOCODER:-nominatim}
      ORBIT_DEMO: ${ORBIT_DEMO:-true}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-default}
    ports:
      - "${ORBIT_PORT:-8080}:8080"

volumes:
  orbit-db:
